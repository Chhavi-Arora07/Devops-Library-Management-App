groups:
  - name: library
    rules:
      - alert: LibraryDown
        expr: absent(up{job="library"} == 1)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: No healthy library pod is being scraped}
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="library",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="library"}[5m])) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations: {summary: More than 5% of requests are failing}
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="library"}[5m]))) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations: {summary: 95th percentile latency is above 500 ms}
