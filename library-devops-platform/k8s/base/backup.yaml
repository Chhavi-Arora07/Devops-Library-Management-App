apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app: db-job}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: postgres:17-alpine
              command: [sh, -ec]
              args:
                - |
                  file="/backups/library-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump -Fc -f "$file.partial" "$DATABASE_URL"
                  mv "$file.partial" "$file"
                  # keep the newest 28 files (7 days at 4 per day)
                  ls -1t /backups/*.dump | tail -n +29 | xargs -r rm --
                  echo "backup written: $file"
              env:
                - name: DATABASE_URL
                  valueFrom: {secretKeyRef: {name: library-secrets, key: DATABASE_URL}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              volumeMounts:
                - {name: backups, mountPath: /backups}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: backups}
