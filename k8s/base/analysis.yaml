# Abort the release if more than 5% of requests to the NEW pods fail.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate
spec:
  args:
    - name: hash
  metrics:
    - name: error-ratio
      interval: 20s
      count: 3
      failureLimit: 1
      successCondition: result[0] <= 0.05
      provider:
        prometheus:
          address: http://prometheus.observability.svc:9090
          query: |
            (sum(rate(http_requests_total{pod_hash="{{args.hash}}",status=~"5.."}[1m])) or vector(0))
            /
            clamp_min(sum(rate(http_requests_total{pod_hash="{{args.hash}}"}[1m])) or vector(0), 0.001)
