apiVersion: v1
kind: ServiceAccount
metadata:
  name: library
automountServiceAccountToken: false
---
# Argo Rollouts replaces the Deployment so releases go out as a canary.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: library
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  progressDeadlineAbort: true    # pods that never become ready also roll back
  selector:
    matchLabels: {app: library}
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - pause: {duration: 30s}
        - analysis:
            templates: [{templateName: error-rate}]
            args:
              - name: hash
                valueFrom: {podTemplateHashValue: Latest}
        - setWeight: 50
        - pause: {duration: 30s}
        - analysis:
            templates: [{templateName: error-rate}]
            args:
              - name: hash
                valueFrom: {podTemplateHashValue: Latest}
  template:
    metadata:
      labels: {app: library}
      annotations: {prometheus.io/scrape: "true"}
    spec:
      serviceAccountName: library
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: init-schema
          image: library-app:dev
          command: [python, -m, app.db]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: library-secrets, key: DATABASE_URL}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: app
          image: library-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
            - {name: metrics, containerPort: 9100}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: library-secrets, key: DATABASE_URL}}
            - name: API_KEY
              valueFrom: {secretKeyRef: {name: library-secrets, key: API_KEY}}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: library}}
---
apiVersion: v1
kind: Service
metadata:
  name: library
spec:
  type: NodePort
  selector: {app: library}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: library
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: library}
