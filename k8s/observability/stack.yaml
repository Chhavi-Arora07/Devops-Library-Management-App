apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: observability}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: alloy, namespace: observability}
---
# Least privilege: both can only read pods in the library namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pod-reader, namespace: library}
rules:
  - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: log-reader, namespace: library}
rules:
  - {apiGroups: [""], resources: [pods, pods/log], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus, namespace: library}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-reader}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: observability}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: alloy, namespace: library}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: log-reader}
subjects: [{kind: ServiceAccount, name: alloy, namespace: observability}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prometheus-data, namespace: observability}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: loki-data, namespace: observability}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: observability}
spec:
  strategy: {type: Recreate}
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.5
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports: [{containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: 9090}}
          livenessProbe: {httpGet: {path: /-/healthy, port: 9090}, initialDelaySeconds: 30}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 768Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - {name: config, configMap: {name: prometheus}}
        - {name: data, persistentVolumeClaim: {claimName: prometheus-data}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: observability}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: observability}
spec:
  strategy: {type: Recreate}
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: loki
          image: grafana/loki:3.7.10
          args: [-config.file=/etc/loki/loki.yml]
          ports: [{containerPort: 3100}]
          readinessProbe: {httpGet: {path: /ready, port: 3100}, initialDelaySeconds: 15}
          livenessProbe: {httpGet: {path: /ready, port: 3100}, initialDelaySeconds: 30}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 768Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: loki}}
        - {name: data, persistentVolumeClaim: {claimName: loki-data}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: observability}
spec:
  selector: {app: loki}
  ports: [{port: 3100}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alloy, namespace: observability}
spec:
  selector: {matchLabels: {app: alloy}}
  template:
    metadata: {labels: {app: alloy}}
    spec:
      serviceAccountName: alloy
      securityContext: {runAsNonRoot: true, runAsUser: 473, runAsGroup: 473, fsGroup: 473, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: alloy
          image: grafana/alloy:v1.22.0
          args: [run, /etc/alloy/config.alloy, --storage.path=/tmp/alloy, "--server.http.listen-addr=0.0.0.0:12345"]
          ports: [{containerPort: 12345}]
          readinessProbe: {httpGet: {path: /-/ready, port: 12345}}
          livenessProbe: {httpGet: {path: /-/healthy, port: 12345}, initialDelaySeconds: 30}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: alloy}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: observability}
spec:
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: grafana/grafana:13.3.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}
          ports: [{containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: 3000}}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 30}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: providers, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: providers, configMap: {name: grafana-providers}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: observability}
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, nodePort: 30030}]
