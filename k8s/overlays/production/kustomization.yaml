apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: Rollout, name: library}
    patch: |
      - {op: replace, path: /spec/replicas, value: 4}
  - target: {kind: PodDisruptionBudget, name: library}
    patch: |
      - {op: replace, path: /spec/minAvailable, value: 3}
  # No open node port in production: put your TLS gateway in front of this Service.
  - target: {kind: Service, name: library}
    patch: |
      - {op: replace, path: /spec/type, value: ClusterIP}
      - {op: remove, path: /spec/ports/0/nodePort}
